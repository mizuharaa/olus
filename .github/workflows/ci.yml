name: CI

on:
  workflow_call:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    # SQLite and solver workers need no external service containers.
    # Tests use isolated state and load the Nimbus network from YAML.
    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry==1.8.0

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('apps/api/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check src/ tests/

      - name: Format check (ruff format)
        run: poetry run ruff format --check src/ tests/

      - name: Type check (mypy)
        run: poetry run mypy src/ --ignore-missing-imports

      - name: Run tests (pytest)
        run: poetry run pytest tests/ -v --tb=short --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: apps/api/coverage.xml
          flags: backend
        continue-on-error: true

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # Align with apps/web/Dockerfile — react-leaflet peers React 18; project uses React 19.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Require versioned workspace routes
        run: |
          git ls-files --error-unmatch -- ':(literal)app/app/account/page.tsx' ':(literal)app/app/runs/[id]/page.tsx' ':(literal)app/app/scenarios/[id]/setup/page.tsx'

      - name: Lint (eslint)
        run: npm run lint

      - name: Verify release and session boundaries
        run: node scripts/check-release-boundaries.cjs

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: 1

  # ── Docker Build ─────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # API Dockerfile expects repo root as context (COPY apps/api/..., COPY data/).
      - name: Build API image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: olus-api:ci

      - name: Build web image (no push)
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: olus-web:ci

name: Deploy AWS

# Builds the arm64 API image, pushes it to ECR, then tells the single EC2 box to
# pull and restart over SSM. No ECS, no ALB — see infra/aws/README.md.
# The Next.js site is not here: Vercel deploys it from main on its own.

on:
  # Manual until the AWS stack exists (terraform apply in infra/aws). Re-enable
  # the push trigger after the first successful dispatch:
  #   push: { branches: [main], paths: ["apps/api/**", "infra/aws/templates/**"] }
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: olus-aws-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  API_REPOSITORY: olus-api

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main'
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The instance is t4g (Graviton); x86 runners need emulation to build arm64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: production
          platforms: linux/arm64
          build-args: BUILD_SHA=${{ github.sha }}
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.API_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.API_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=api-arm64
          cache-to: type=gha,mode=max,scope=api-arm64

      - name: Roll the containers over SSM
        id: ssm
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          API_CORS_ORIGINS: ${{ vars.API_CORS_ORIGINS || 'https://olus.sh,https://www.olus.sh' }}
          API_LOG_GROUP: ${{ vars.API_LOG_GROUP || '/olus/app' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from string import Template
          values = dict(api_image=f"{os.environ['REGISTRY']}/{os.environ['API_REPOSITORY']}:{os.environ['GITHUB_SHA']}", region=os.environ['AWS_REGION'], log_group=os.environ['API_LOG_GROUP'], cors_origins=os.environ['API_CORS_ORIGINS'])
          template = Template(Path('infra/aws/templates/docker-compose.yml.tftpl').read_text())
          Path('/tmp/olus-compose.yml').write_text(template.substitute({key: json.dumps(value) for key, value in values.items()}))
          PY
          # Built as a file so the shell never has to quote JSON inside JSON.
          jq -n --arg region "$AWS_REGION" --arg registry "$REGISTRY" --rawfile compose /tmp/olus-compose.yml --rawfile backup infra/aws/backup.sh '{
            commands: [
              "set -euo pipefail",
              "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($registry)",
              "echo \($compose | @base64) | base64 -d > /opt/olus/docker-compose.next.yml",
              "docker compose -f /opt/olus/docker-compose.next.yml config --quiet",
              "mv /opt/olus/docker-compose.next.yml /opt/olus/docker-compose.yml",
              "docker compose -f /opt/olus/docker-compose.yml pull",
              "docker compose -f /opt/olus/docker-compose.yml up -d --wait --wait-timeout 180",
              "echo \($backup | @base64) | base64 -d > /etc/cron.daily/olus-backup",
              "chmod +x /etc/cron.daily/olus-backup",
              "docker image prune -f"
            ]
          }' > /tmp/ssm-params.json
          CMD_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets 'Key=tag:Name,Values=olus-app' \
            --comment "deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 600 \
            --parameters file:///tmp/ssm-params.json \
            --query Command.CommandId --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command $CMD_ID"

      - name: Wait for the SSM command
        run: |
          set -euo pipefail
          ID=$(aws ec2 describe-instances \
            --filters 'Name=tag:Name,Values=olus-app' 'Name=instance-state-name,Values=running' \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id '${{ steps.ssm.outputs.command_id }}' --instance-id "$ID" \
              --query Status --output text 2>/dev/null || true)
            echo "status: $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut) ;;
              *) sleep 10; continue ;;
            esac
            aws ssm get-command-invocation \
              --command-id '${{ steps.ssm.outputs.command_id }}' --instance-id "$ID" \
              --query '{out:StandardOutputContent,err:StandardErrorContent}' --output text
            exit 1
          done
          echo "SSM command did not finish in 10 minutes"
          exit 1

      - name: Verify /health through CloudFront
        run: |
          set -euo pipefail
          URL="${{ vars.API_URL || 'https://api.olus.sh' }}/health"
          for i in $(seq 1 12); do
            BODY=$(curl -fsS "$URL" || true)
            echo "health attempt $i"
            if jq -e --arg sha "$GITHUB_SHA" '.status == "ok" and .revision == $sha' <<< "$BODY" >/dev/null; then
              CODE=$(curl -s -o /dev/null -w '%{http_code}' "${URL%/health}/api/v1/account/session")
              [ "$CODE" = "401" ] && exit 0
            fi
            sleep 10
          done
          echo "Expected API revision and account route were not verified at $URL"
          exit 1
